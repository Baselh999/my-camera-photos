<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كاميرا - رفع تلقائي</title>
  <style>
    body { font-family: Tajawal, Arial; text-align: center; background: #000; color: #0f0; padding: 20px; margin: 0; }
    video, canvas { width: 90%; max-width: 640px; border: 4px solid #0f9; border-radius: 20px; margin: 15px auto; display: block; box-shadow: 0 0 20px #0f9; }
    #status { font-size: 24px; margin: 20px; }
    .countdown { font-size: 70px; font-weight: bold; color: #0ff; text-shadow: 0 0 15px #0ff; }
    h1 { color: #0ff; text-shadow: 0 0 10px #0ff; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>كاميرا + رفع تلقائي على GitHub</h1>
  <p>اسمح بالكاميرا.. كل شيء تلقائي!</p>
  
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  
  <div id="status">جاري تشغيل الكاميرا...</div>
  <div class="countdown" id="countdown">3</div>

  <script>
    // ⚙️ عدّل هنا فقط ⚙️
    const CONFIG = {
      repo: "Baselh999/my-camera-photos",     // غيّر إذا تريد مستودع آخر
      folder: "photos",                       // المجلد الذي ستُرفع فيه الصور (سيُنشأ تلقائيًا)
      interval: 5000                          // كل 5 ثوانٍ (غيّر إلى 3000 إذا تريد كل 3 ثوانٍ)
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const countdownEl = document.getElementById('countdown');

    // جلب التوكن بطريقة آمنة (مرة واحدة فقط)
    function getToken() {
      let token = localStorage.getItem("github_camera_token");
      if (!token) {
        token = prompt("أدخل GitHub Token الخاص بك (مرة واحدة فقط):", "");
        if (token && token.startsWith("ghp_")) {
          localStorage.setItem("github_camera_token", token);
          alert("تم حفظ التوكن بنجاح!");
        } else {
          alert("التوكن غير صحيح!");
          return null;
        }
      }
      return token;
    }

    const TOKEN = getToken();
    if (!TOKEN) {
      status.innerHTML = "<span style='color:red;'>تم إلغاء العملية - التوكن مطلوب</span>";
      throw new Error("No token");
    }

    // تشغيل الكاميرا (الكاميرا الخلفية في الموبايل)
    navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} } 
    })
    .then(stream => {
      video.srcObject = stream;
      video.play();
      status.textContent = "الكاميرا جاهزة! الصورة الأولى بعد قليل...";
      setTimeout(startCountdown, 2000);
    })
    .catch(err => {
      status.innerHTML = `<span style="color:red;">خطأ في الكاميرا:<br>${err.message}</span>`;
    });

    function startCountdown() {
      let sec = 3;
      countdownEl.textContent = sec;
      const timer = setInterval(() => {
        sec--;
        countdownEl.textContent = sec;
        if (sec <= 0) {
          clearInterval(timer);
          countdownEl.textContent = "📸";
          takeAndUpload();
        }
      }, 1000);
    }

    async function takeAndUpload() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0);

      canvas.toBlob(async blob => {
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        const filename = `${CONFIG.folder}/صورة_${timestamp}.jpg`;

        const base64 = await blobToBase64(blob);

        try {
          const response = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${filename}`, {
            method: "PUT",
            headers: {
              Authorization: `token ${TOKEN}`,
              Accept: "application/vnd.github.v3+json"
            },
            body: JSON.stringify({
              message: `رفع تلقائي ${timestamp}`,
              content: base64,
              branch: "main"
            })
          });

          const data = await response.json();

          if (data.content && data.content.html_url) {
            status.innerHTML = `تم الرفع بنجاح! 
              <br><a href="${data.content.html_url}" target="_blank" style="color:#0ff;">عرض الصورة</a>`;
          } else {
            status.innerHTML = `<span style="color:orange;">فشل الرفع: ${data.message || "خطأ غير معروف"}</span>`;
          }
        } catch (err) {
          status.innerHTML = `<span style="color:red;">خطأ في الاتصال: ${err.message}</span>`;
        }

        // التقاط الصورة التالية
        setTimeout(startCountdown, 3000);
      }, "image/jpeg", 0.9);
    }

    function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
