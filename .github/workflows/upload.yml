name: Upload from Camera

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # كل 5 دقايق (اختياري)

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Receive file
        uses: actions/upload-artifact@v4
        with:
          name: camera-files
          path: /tmp/camera/
          retention-days: 1
      - name: Upload to repo
        env:
          TOKEN: ${{ secrets.CAMERA_TOKEN }}
        run: |
          mkdir -p photos
          cd /tmp/camera || exit
          for file in *; do
            [ -f "$file" ] || continue
            base64_file=$(base64 -w 0 "$file")
            curl -s -X PUT \
              -H "Authorization: token $TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/Baselh999/my-camera-photos/contents/photos/$file \
              -d "{\"message\":\"رفع تلقائي\",\"content\":\"$base64_file\",\"branch\":\"master\"}"
          done
