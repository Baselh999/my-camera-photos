name: Upload Camera Files

on:
  repository_dispatch:
    types: [camera-upload]
  workflow_dispatch:  # عشان تقدر تشغّله يدويًا أول مرة

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from client
        uses: actions/download-artifact@v4
        with:
          name: camera-files
          path: /tmp/camera/

      - name: Upload files to repo
        env:
          TOKEN: ${{ secrets.CAMERA_TOKEN }}
        run: |
          cd /tmp/camera/ || exit 1
          for file in *; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              base64_content=$(base64 -w 0 "$file")
              curl -s -X PUT \
                -H "Authorization: token $TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"message\":\"رفع تلقائي $file\",\"content\":\"$base64_content\",\"branch\":\"master\"}" \
                "https://api.github.com/repos/Baselh999/my-camera-photos/contents/photos/$file"
              echo "Uploaded $file"
            fi
          done
