name: Camera Upload

on:
  repository_dispatch:
    types: [upload-files]
  workflow_dispatch

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create photos folder
        run: mkdir -p photos

      - name: Download uploaded files
        uses: actions/download-artifact@v4
        with:
          name: camera-files
          path: photos/

      - name: Commit & Push
        run: |
          git config user.name "Camera Bot"
          git config user.email "camera@bot.com"
          git add photos/*
          git commit -m "رفع تلقائي من الكاميرا $(date)" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
