<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كاميرا مباشرة</title>
  <style>
    body{background:#000;color:#0f9;font-family:Tajawal,Arial;text-align:center;padding:20px;}
    video{width:95%;max-width:680px;border:6px solid #0f9;border-radius:20px;box-shadow:0 0 40px #0f9;}
    #s{font-size:22px;color:#0ff;margin:15px;}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1 style="color:#0ff;text-shadow:0 0 20px #0ff;">كاميرا مباشرة - رفع تلقائي</h1>
  <video id="v" autoplay playsinline></video>
  <div id="s">جاري تشغيل الكاميرا...</div>

  <script>
    const v = document.getElementById('v');
    const s = document.getElementById('s');
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false})
    .then(stream => {
      v.srcObject = stream;
      s.textContent = "شغالة ✅ صورة كل 5 ثواني + فيديو كل 5 دقايق";

      // صورة كل 5 ثواني
      setInterval(() => {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v,0,0);
        c.toBlob(b => send(b, `صورة_${Date.now()}.jpg`));
      }, 5000);

      // فيديو كل 5 دقايق
      let r, chunks=[];
      const start = () => {
        chunks=[];
        r = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp8'});
        r.ondataavailable = e => chunks.push(e.data);
        r.onstop = () => send(new Blob(chunks,{type:'video/webm'}), `فيديو_${Date.now()}.webm`);
        r.start();
      };
      start();
      setInterval(() => { r.stop(); setTimeout(start,2000); }, 5*60*1000);
    })
    .catch(e=>s.innerHTML=`<span style="color:red;">الكاميرا محظورة: ${e.message}</span>`);

    function send(blob, name) {
      const fd = new FormData();
      fd.append('file', blob, name);
      fetch('https://api.github.com/repos/Baselh999/my-camera-photos/uploads', {method:'POST',body:fd});
      s.innerHTML += `<br>تم رفع ${name}`;
    }
  </script>
</body>
</html>
