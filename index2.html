<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>كاميرا مباشرة - رفع تلقائي</title>
  <style>
    body {font-family: Tajawal,Arial;background:#000;color:#0f9;margin:0;padding:20px;text-align:center;}
    video {width:95%;max-width:680px;border:5px solid #0f9;border-radius:20px;box-shadow:0 0 30px #0f9;margin:10px auto;display:block;}
    #status {font-size:22px;margin:15px;color:#0ff;}
    .info {font-size:18px;color:#0f0;margin:10px;}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1 style="color:#0ff;text-shadow:0 0 15px #0ff;">كاميرا مباشرة - رفع تلقائي</h1>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">جاري تشغيل الكاميرا...</div>
  <div class="info">صورة كل 5 ثواني • فيديو كل 5 دقايق</div>

  <script>
  const TOKEN = "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";
  const REPO = "Baselh999/my-camera-photos";
  const FOLDER = "photos";

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  let mediaRecorder;
  let recordedChunks = [];

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
    .then(stream => {
      video.srcObject = stream;
      status.textContent = "الكاميرا شغالة ✅ يتم الرفع تلقائيًا...";

      // صورة كل 5 ثواني
      setInterval(capturePhoto, 5000);

      // فيديو كل 5 دقايق
      startRecording(stream);
      setInterval(() => {
        stopRecordingAndUpload();
        setTimeout(() => startRecording(stream), 2000);
      }, 5*60*1000);
    })
    .catch(err => status.innerHTML = `<span style="color:red;">خطأ: ${err.message}</span>`);

  function capturePhoto() {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(blob => uploadFile(blob, `صورة_${new Date().toISOString().replace(/[:.]/g,"-")}.jpg`), 'image/jpeg', 0.9);
  }

  function startRecording(stream) {
    recordedChunks = [];
    const options = { mimeType: 'video/webm;codecs=vp8,opus' };  // ← vp8 مدعوم في كل مكان
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options mimeType = 'video/webm';
    }
    mediaRecorder = new MediaRecorder(stream, options);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();
  }

  function stopRecordingAndUpload() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        uploadFile(blob, `فيديو_${new Date().toISOString().replace(/[:.]/g,"-")}.webm`);
        recordedChunks = [];
      };
    }
  }

  async function uploadFile(blob, filename) {
    const path = `${FOLDER}/${filename}`;
    const base64 = await new Promise(r => {
      const reader = new FileReader();
      reader.onload = () => r(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });

    fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
      method: "PUT",
      headers: { Authorization: `token ${TOKEN}`, Accept: "application/vnd.github.v3+json" },
      headers: { Authorization: `token ${TOKEN}` },
      body: JSON.stringify({
        message: `رفع تلقائي ${filename}`,
        content: base64,
        branch: "master"
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.content) {
        status.innerHTML = `تم رفع: <a href="${data.content.html_url}" target="_blank" style="color:#0ff;">${filename}</a>`;
      }
    })
    .catch(err => console.error(err));
  }
</script>
</body>
</html>
