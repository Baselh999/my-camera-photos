<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كاميرا مباشرة - رفع تلقائي</title>
  <style>
    body{background:#000;color:#0f9;font-family:Tajawal,Arial;text-align:center;padding:20px;margin:0;}
    video{width:90%;max-width:680px;border:6px solid #0f9;border-radius:20px;box-shadow:0 0 40px #0f9;margin:20px auto;display:block;}
    #s{font-size:24px;color:#0ff;margin:15px;}
    h1{color:#0ff;text-shadow:0 0 20px #0ff;}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>كاميرا مباشرة - رفع تلقائي</h1>
  <video id="v" autoplay playsinline muted></video>
  <div id="s">جاري جلب التوكن وتشغيل الكاميرا...</div>

  <script>
    let TOKEN = null;

    // جلب التوكن من السيرفر الخارجي (Vercel) - آمن 100%
    fetch("http://127.0.0.1:5555/api.js")
      .then(r => r.json())
      .then(data => {
        TOKEN = data.token;
        document.getElementById("s").textContent = "تم جلب التوكن بنجاح، جاري تشغيل الكاميرا...";
        startCamera();
      })
      .catch(() => {
        document.getElementById("s").innerHTML = "<span style='color:red;'>فشل جلب التوكن</span>";
      });

    function startCamera() {
      navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
        .then(stream => {
          document.getElementById("v").srcObject = stream;
          document.getElementById("s").innerHTML = "شغالة ✅ صورة كل 5 ثواني";

          setInterval(() => {
            const c = document.createElement("canvas");
            c.width = document.getElementById("v").videoWidth;
            c.height = document.getElementById("v").videoHeight;
            c.getContext("2d").drawImage(document.getElementById("v"), 0, 0);
            c.toBlob(blob => {
              const reader = new FileReader();
              reader.onload = () => {
                const base64 = reader.result.split(",")[1];
                fetch(`https://api.github.com/repos/Baselh999/my-camera-photos/contents/photos/صورة_${Date.now()}.jpg`, {
                  method: "PUT",
                  headers: {
                    "Authorization": "token " + TOKEN,
                    "Accept": "application/vnd.github.v3+json"
                  },
                  body: JSON.stringify({
                    message: "رفع تلقائي",
                    content: base64,
                    branch: "master"
                  })
                })
                .then(() => {
                  document.getElementById("s").innerHTML += "<br>تم الرفع بنجاح!";
                });
              };
              reader.readAsDataURL(blob);
            }, "image/jpeg", 0.92);
          }, 5000);
        })
        .catch(e => {
          document.getElementById("s").innerHTML = `<span style="color:red;">الكاميرا محظورة: ${e.message}</span>`;
        });
    }
  </script>
</body>
</html>
